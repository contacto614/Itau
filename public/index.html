<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Sitio en mantenimiento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body{font-family: Arial, Helvetica, sans-serif;background:#f6f7fb;color:#222;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
      .card{max-width:680px;padding:28px;border-radius:12px;background:#fff;box-shadow:0 6px 20px rgba(16,24,40,.08);text-align:center}
      h1{margin:0 0 8px;font-size:22px;color:#111}
      p{margin:8px 0 0;color:#444}
      .note{margin-top:12px;font-size:13px;color:#666}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sitio temporalmente desconectado por motivos de seguridad</h1>
      <p>Hemos detectado actividad sospechosa y estamos investigando. Para proteger a los usuarios hemos desactivado temporalmente el sitio.</p>
      <p class="note">Si necesitas soporte urgente, contacta al administrador del sitio.</p>
    </div>
  </body>
</html>
